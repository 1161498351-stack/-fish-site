<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>灵签 · 八字事业</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:linear-gradient(180deg,rgba(20,5,5,.82) 0%,rgba(30,10,10,.78) 50%,rgba(10,3,3,.88) 100%),
    url(背景.png) center/cover no-repeat fixed;
  color:#f0d080;font-family:'STSong','Songti SC','Noto Serif SC','SimSun',serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;
}
.container{max-width:480px;width:100%;padding:20px;text-align:center}

.decor{margin-bottom:12px}
.decor span{display:inline-block;vertical-align:middle}
.decor .line{width:36px;height:1px;background:linear-gradient(90deg,transparent,#a04040,transparent);margin:0 10px}
.decor .diamond{width:8px;height:8px;background:#c04040;transform:rotate(45deg);margin:0 4px}
h1{font-size:44px;letter-spacing:12px;font-weight:400;margin-bottom:6px;
  background:linear-gradient(180deg,#f8e0a0 0%,#c08848 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{font-size:13px;color:#704040;letter-spacing:6px;margin-bottom:8px}

.bazi-toggle{font-size:12px;color:#604040;letter-spacing:2px;cursor:pointer;
  padding:6px 18px;border:1px solid #402020;border-radius:14px;display:inline-block;
  transition:all .3s;margin-bottom:24px}
.bazi-toggle:hover{color:#b08060;border-color:#604040}
.bazi-toggle.active{color:#c08040;border-color:#604040;background:rgba(60,20,20,.3)}

.bazi-panel{
  background:linear-gradient(180deg,rgba(30,10,10,.9),rgba(20,6,6,.9));
  border:1px solid #402020;border-radius:14px;padding:20px 16px;margin-bottom:24px}
.bazi-panel .row{display:flex;gap:8px;margin-bottom:10px;justify-content:center;flex-wrap:wrap}
.bazi-panel label{font-size:12px;color:#805050;letter-spacing:1px;display:block;margin-bottom:3px}
.bazi-panel select{background:#1a0808;color:#e0c080;border:1px solid #503030;border-radius:6px;
  padding:7px 10px;font-size:14px;font-family:inherit;outline:none;min-width:60px}
.bazi-panel select:focus{border-color:#a06040}
.bazi-panel .submit-btn{display:block;margin:10px auto 0;padding:8px 28px;
  background:linear-gradient(135deg,#6b2020,#4a1010);border:1px solid #703030;
  color:#f0d080;font-family:inherit;font-size:13px;letter-spacing:3px;
  border-radius:18px;cursor:pointer;transition:all .3s}
.bazi-panel .submit-btn:hover{background:linear-gradient(135deg,#803030,#5a1818)}

.bazi-result{display:none;margin-bottom:20px}
.bazi-result.show{display:block}
.bazi-pillars{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.pillar{background:rgba(20,6,6,.8);border:1px solid #503030;border-radius:10px;
  padding:10px 12px;text-align:center;min-width:64px}
.pillar .p-name{font-size:10px;color:#704040;letter-spacing:2px;margin-bottom:2px}
.pillar .p-gan{font-size:18px;color:#f0d080;font-weight:700}
.pillar .p-zhi{font-size:14px;color:#c09060}
.day-master{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:12px;
  font-size:12px;letter-spacing:2px;border:1px solid #604040}
.dm-wood{color:#6b9;border-color:#6b9}.dm-fire{color:#f66;border-color:#f66}
.dm-earth{color:#db5;border-color:#db5}.dm-metal{color:#fc6;border-color:#fc6}
.dm-water{color:#69c;border-color:#69c}

.tong-wrap{position:relative;width:160px;height:240px;margin:0 auto 32px;
  filter:drop-shadow(0 8px 32px rgba(0,0,0,.6))}
.tong{
  position:relative;width:100%;height:100%;
  background:linear-gradient(180deg,#5a2828 0%,#3a1818 40%,#2d1010 100%);
  border-radius:16px 16px 22px 22px;border:2px solid #704030;
  box-shadow:inset 0 4px 16px rgba(0,0,0,.4),0 0 0 6px rgba(10,4,4,.5);
  cursor:pointer;transition:transform .4s;overflow:hidden}
.tong:active{transform:scale(.96)}
.tong::before{content:'';position:absolute;top:4px;left:8px;right:8px;height:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.04),transparent);border-radius:12px;pointer-events:none}
.tong .ring{position:absolute;left:4px;right:4px;height:3px;
  background:linear-gradient(90deg,transparent,#906040,transparent);opacity:.5}
.tong .ring:nth-child(1){top:22%}.tong .ring:nth-child(2){top:52%}.tong .ring:nth-child(3){top:78%}
.tong .sticks-area{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  display:flex;flex-wrap:wrap;justify-content:center;gap:4px;width:110px}
.tong .stick{width:3px;height:64px;background:linear-gradient(180deg,#ecd4a0,#b88850);border-radius:2px}
.tong .stick.gold{background:linear-gradient(180deg,#ffd700,#ff9400);animation:pulse .7s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 3px #ffd700}50%{box-shadow:0 0 14px #ff9400,0 0 24px #ff6600}}
.tong .label{position:absolute;bottom:22px;width:100%;text-align:center;
  font-size:16px;color:#b07050;letter-spacing:5px;pointer-events:none}
.tong .base{position:absolute;bottom:-8px;left:-4px;right:-4px;height:12px;
  background:linear-gradient(180deg,#4a2020,#2d1010);border-radius:0 0 16px 16px;border:2px solid #5a3020;border-top:none}

.tong.shaking{animation:shake .12s infinite}
@keyframes shake{
  0%,100%{transform:translateX(0)rotate(0deg)}
  15%{transform:translateX(-8px)rotate(-4deg)}30%{transform:translateX(8px)rotate(4deg)}
  45%{transform:translateX(-12px)rotate(-6deg)}60%{transform:translateX(12px)rotate(6deg)}
  75%{transform:translateX(-5px)rotate(-2deg)}90%{transform:translateX(5px)rotate(2deg)}}

.stick-fly{position:fixed;width:4px;height:80px;border-radius:3px;z-index:200;
  background:linear-gradient(180deg,#ffd700,#ff8c00);box-shadow:0 0 20px rgba(255,180,0,.8);
  animation:flyUp .9s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes flyUp{0%{transform:translateY(0)rotate(0deg);opacity:1}60%{opacity:1}100%{transform:translateY(-60vh)rotate(720deg);opacity:0}}
.particle{position:fixed;width:4px;height:4px;border-radius:50%;z-index:199;pointer-events:none;
  animation:partUp .8s ease-out forwards}
@keyframes partUp{0%{transform:translate(0,0)scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy))scale(0);opacity:0}}

.result{display:none;opacity:0;transform:translateY(40px);
  background:linear-gradient(180deg,rgba(35,12,12,.97),rgba(20,6,6,.97));
  border:1px solid #5a3030;border-radius:20px;padding:32px 24px 24px;
  box-shadow:0 12px 60px rgba(0,0,0,.6);transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.result.show{display:block;opacity:1;transform:translateY(0)}
.mode-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.mode-tab{padding:8px 20px;border-radius:20px;border:1px solid #503030;background:transparent;color:#906050;font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:2px;transition:all .2s}
.mode-tab.on{background:rgba(180,80,40,.25);border-color:#a06040;color:#f0c080;font-weight:700}
.mode-tab:hover{border-color:#a06040}
.fortune-text{font-size:14px;color:#c8a880;line-height:2;text-align:left;padding:10px 0;white-space:pre-line}
.fortune-text em{color:#ffd700;font-weight:700;font-style:normal}
.poem-display{font-size:18px;color:#f0d080;line-height:2.4;text-align:center;padding:16px 0;letter-spacing:2px;font-weight:700;border-top:1px solid #402020;border-bottom:1px solid #402020;margin:8px 0}
.sign-name-display{text-align:center;font-size:20px;color:#e0c060;letter-spacing:4px;margin:8px 0;font-weight:700}
.sign-level{display:inline-block;padding:4px 20px;border-radius:20px;font-size:13px;border:1px solid #c08040;color:#e0b040;text-align:center;margin:4px auto;letter-spacing:2px}
.reading-label{font-size:12px;color:#a06040;letter-spacing:2px;margin:12px 0 4px}
.advice-label{font-size:12px;color:#a06040;letter-spacing:2px;margin:12px 0 4px}
.result .again{display:block;margin:22px auto 0;padding:11px 36px;background:transparent;
  border:1px solid #503030;color:#a08060;font-family:inherit;font-size:14px;letter-spacing:3px;
  border-radius:22px;cursor:pointer;transition:all .3s}
.result .again:hover{border-color:#c08060;color:#f0d080;box-shadow:0 0 20px rgba(180,80,80,.15)}
.bottom-text{font-size:11px;color:#301818;letter-spacing:2px;margin-top:28px}
</style>
</head>
<body>
<div class="container">

  <div class="decor"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>
  <h1>灵 签</h1>
  <p class="subtitle">· 八字事业 ·</p>

  <div class="bazi-panel" id="baziPanel">
    <div class="row">
      <div><label>年</label><select id="byear"></select></div>
      <div><label>月</label><select id="bmonth"></select></div>
      <div><label>日</label><select id="bday"></select></div>
      <div><label>时</label><select id="bhour"><option value="0">子时 23-1</option><option value="1">丑时 1-3</option><option value="2">寅时 3-5</option><option value="3">卯时 5-7</option><option value="4">辰时 7-9</option><option value="5">巳时 9-11</option><option value="6">午时 11-13</option><option value="7">未时 13-15</option><option value="8">申时 15-17</option><option value="9">酉时 17-19</option><option value="10">戌时 19-21</option><option value="11">亥时 21-23</option></select></div>
    </div>
    <button class="submit-btn" onclick="calcBazi()">排八字</button>
    <div class="bazi-result" id="baziResult">
      <div class="bazi-pillars" id="pillars"></div>
      <div class="day-master" id="dayMaster"></div>
    </div>
  </div>

  <div class="tong-wrap" id="tongWrap">
    <div class="tong" id="tong" onclick="shake()">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <div class="sticks-area">
        <div class="stick"></div><div class="stick"></div><div class="stick"></div>
        <div class="stick"></div><div class="stick"></div><div class="stick gold"></div>
        <div class="stick"></div><div class="stick"></div><div class="stick"></div>
        <div class="stick"></div><div class="stick"></div><div class="stick"></div>
        <div class="stick"></div><div class="stick"></div>
      </div>
      <div class="label">轻触摇签</div>
      <div class="base"></div>
    </div>
  </div>

  <div class="result" id="result">
    <div class="mode-tabs" id="modeTabs">
      <button class="mode-tab on" data-mode="today" onclick="switchMode('today')">🔮 今日运势</button>
      <button class="mode-tab" data-mode="life" onclick="switchMode('life')">📜 一生总览</button>
    </div>
    <div class="fortune-text" id="fortuneText"></div>
    <button class="again" onclick="backToTong()">再求一签</button>
  </div>

  <p class="bottom-text">心诚则灵 · 仅供娱乐<br><a href="/" style="color:#503030;text-decoration:none;font-size:12px">← 返回摸鱼首页</a></p>
</div>

<script>
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const WUXING_MAP={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};

function yearPillar(y){const i=(y-4)%60;return{gan:GAN[i%10],zhi:ZHI[i%12],idx:i};}
function monthPillar(yearGan,m){const yg=GAN.indexOf(yearGan);
  const monthGan=(yg*2+m)%10;return{gan:GAN[monthGan],zhi:ZHI[(m+1)%12]};}
function dayPillar(y,m,d){const date=new Date(y,m-1,d);
  const ref=new Date(1900,0,1);const days=Math.floor((date-ref)/864e5);
  return{gan:GAN[(days%10+10)%10],zhi:ZHI[(days%12+10)%12]};}
function hourPillar(dayGan,h){const dg=GAN.indexOf(dayGan);
  const hg=(dg*2+h)%10;return{gan:GAN[hg],zhi:ZHI[h]};}

let baziData=null;

function calcBazi(){
  const y=parseInt(document.getElementById('byear').value);
  const m=parseInt(document.getElementById('bmonth').value);
  const d=parseInt(document.getElementById('bday').value);
  const h=parseInt(document.getElementById('bhour').value);
  if(!y||!m||!d){return}

  const yp=yearPillar(y), mp=monthPillar(yp.gan,m);
  const dp=dayPillar(y,m,d), hp=hourPillar(dp.gan,h);
  baziData={year:yp,month:mp,day:dp,hour:hp};

  const pillars=[
    {name:'年柱',gan:yp.gan,zhi:yp.zhi},{name:'月柱',gan:mp.gan,zhi:mp.zhi},
    {name:'日柱',gan:dp.gan,zhi:dp.zhi},{name:'时柱',gan:hp.gan,zhi:hp.zhi}
  ];
  document.getElementById('pillars').innerHTML=pillars.map(p=>
    '<div class="pillar"><div class="p-name">'+p.name+'</div><div class="p-gan">'+p.gan+'</div><div class="p-zhi">'+p.zhi+'</div></div>'
  ).join('');

  const dm=WUXING_MAP[dp.gan];
  const dmEl=document.getElementById('dayMaster');
  dmEl.textContent='日主 · '+dp.gan+'（'+dm+'命）';
  dmEl.className='day-master dm-'+{木:'wood',火:'fire',土:'earth',金:'metal',水:'water'}[dm];
  document.getElementById('baziResult').classList.add('show');
}

function baziReading(dayGan,lotType){
  const wx=WUXING_MAP[dayGan];
  const readings={
    '木':{
      good:'<em>甲/乙木命</em>的你，今年木气旺盛。木主生长——<em>事业如春笋破土，适合开疆拓土</em>。上半年贵人多为属虎兔猪之人。创业、跳槽、转行皆宜，尤其与文化、教育、环保相关的行业发力最佳。',
      warn:'<em>甲/乙木命</em>的你，木逢金秋需收敛。今年不是扩张之年——<em>适合扎根而非开花</em>。把地基打牢，学习考证内功优先。避免和属猴鸡之人有利益纠葛。秋冬低调做人，春天自有回报。',
      bad:'<em>甲/乙木命</em>今年遇到金克木之局。<em>但不破不立——砍掉枯枝才能发出新芽</em>。不要死守现在的岗位或方向不放。换个角度想：你被"修剪"了，是为了来年长得更高。'},
    '火':{
      good:'<em>丙/丁火命</em>的你，今年火借风势。<em>发光发热是你的天命——站到台前去</em>。适合演讲、汇报、自媒体、销售这类需要感染力的工作。上半年贵人多为属蛇马羊之人。但注意别烧过头，团队关系要维护。',
      warn:'<em>丙/丁火命</em>今年火势被水压制。<em>你的一腔热血可能遇到冷处理</em>——不要因此灰心。适合转做幕后准备，少抛头露面。避免和属鼠猪之人正面冲突。积攒能量，冬天回暖。',
      bad:'<em>丙/丁火命</em>今年火弱水旺。<em>你像一支快要熄灭的蜡烛——找到助燃你的人很重要</em>。多和积极的人在一起，远离打压你的人。今年"活下来"比"赢"重要。年底火势回升。'},
    '土':{
      good:'<em>戊/己土命</em>的你，今年土厚载物。<em>稳扎稳打是你的王牌——不适合投机取巧</em>。脚踏实地的积累会在年中引来大客户或大项目。贵人多为属牛龙狗之人。房产、建筑、农业相关行业格外顺。',
      warn:'<em>戊/己土命</em>今年土被木克。<em>你可能觉得被"掏空"——项目太多精力分散</em>。学会拒绝，聚焦一两个核心任务。避免同时讨好所有人。属虎兔之人可能带来竞争压力。',
      bad:'<em>戊/己土命</em>今年土虚不固。<em>根基动摇不是你能力的问题，是地壳在运动</em>。行业巨变中站不稳很正常。别裸辞，但可以悄悄准备跳槽。冬天是转机窗口。'},
    '金':{
      good:'<em>庚/辛金命</em>的你，今年金气凌厉。<em>决断力是你的超能力——该砍的砍，该投的投</em>。金融、法律、科技行业特别顺。贵人多为属猴鸡之人。上半年适合跳槽谈薪，大胆开口。',
      warn:'<em>庚/辛金命</em>今年金被火炼。<em>你像一把刀在被淬火——过程痛苦但会变得更锋利</em>。高强度压力下坚持住，技能提升会远超预期。避免和属蛇马之人硬碰硬。',
      bad:'<em>庚/辛金命</em>今年金入火乡而退气。<em>锋芒毕露会伤到自己——收起棱角，先观察再出手</em>。今年最大的敌人是冲动。每一刀都看准了再砍。秋冬会有贵人雪中送炭。'},
    '水':{
      good:'<em>壬/癸水命</em>的你，今年水势浩荡。<em>灵活变通是你最大的优势——顺势而为无往不利</em>。物流、贸易、传媒、互联网行业大利。贵人多为属鼠猪之人。下半年机会尤其多，保持流动不要停。',
      warn:'<em>壬/癸水命</em>今年水被土堵。<em>你可能觉得处处受限、推不动事——不是你的错</em>。换个角度找缝隙，水总能渗透过去。小步迭代比大刀阔斧有效。避免和属牛龙狗之人争权。',
      bad:'<em>壬/癸水命</em>今年水流入死潭。<em>你像被困在一潭死水中——不动会臭，乱动会浊</em>。先停下来看清方向再走。不要因为"别人都在动"就焦虑。静下心来学门新技能，水自然会找到出口。'}
  };
  return readings[wx][lotType]||'';
}

const LOTS=[
{type:'good',sign:'上上签 · 青龙得位',poem:'云开雾散见青天\n紫气东来满庭前\n贵人已在来时路\n只待春风度玉关',reading:'<em>今年是事业的转折之年。</em>上半年虽有迷雾，清明过后形势渐明。年中是关键窗口——重要机会将出现，<em>务必主动争取，不可犹豫</em>。秋冬有晋升或跨行良机，贵人来自比你年长的前辈。',advice:'宜：主动出击 · 上半年积累 · 下半年收割'},
{type:'good',sign:'上上签 · 日照金山',poem:'金乌出海耀千峰\n万里云烟一扫空\n自有机缘来凑巧\n不须惆怅叹途穷',reading:'<em>天时地利人和齐聚。</em>一个成功会引发连锁反应。上半年完成的项目将在业内形成口碑效应。<em>主动分享成果、站上台前</em>，曝光度直接决定下半年能走多高。创业者有望拿到关键融资。',advice:'宜：站上台前 · 放大成果 · 乘胜追击'},
{type:'good',sign:'上签 · 凤凰于飞',poem:'梧桐枝上凤凰栖\n一鸣惊人天下知\n莫愁前路少知己\n桃李不言自成蹊',reading:'<em>今年的关键词是"破圈"。</em>专业能力已到临界点，只需一个舞台。二季度可能有猎头或跨界机会主动找上门——<em>不要被舒适区困住，跨出去有惊喜</em>。创业者四季度是试水好时机，从小规模验证开始。',advice:'宜：跨界尝试 · 展示自己 · 小步快跑'},
{type:'good',sign:'上签 · 旭日东升',poem:'一轮红日出扶桑\n万里山河尽晓光\n鹏鸟初飞风助力\n青云直上任翱翔',reading:'<em>初入职场或刚转行的你，今年是加速成长之年。</em>学习曲线陡峭但回报丰厚。五六月表现出色会被高层注意到。<em>你的新鲜视角恰好是团队最稀缺的资源</em>。年底有望独当一面。',advice:'宜：大胆提问 · 展现活力 · 快速学习'},

var busy=false,fortuneMode='today';

function shake(){
  if(busy)return;
  busy=true;

  const tong=document.getElementById('tong');
  const result=document.getElementById('result');
  result.classList.remove('show');
  result.style.display='none';

  tong.classList.add('shaking');

  setTimeout(()=>{
    const rect=tong.getBoundingClientRect();
    const fly=document.createElement('div');fly.className='stick-fly';
    fly.style.left=(rect.left+rect.width/2-2)+'px';
    fly.style.top=(rect.top+30)+'px';
    document.body.appendChild(fly);
    for(let i=0;i<16;i++){
      const p=document.createElement('div');p.className='particle';
      p.style.left=(rect.left+rect.width/2)+'px';
      p.style.top=(rect.top+20)+'px';
      p.style.setProperty('--dx',(Math.random()-.5)*200+'px');
      p.style.setProperty('--dy',(-50-Math.random()*150)+'px');
      p.style.background='hsl('+(30+Math.random()*20)+',80%,'+(50+Math.random()*30)+'%)';
      p.style.width=p.style.height=(2+Math.random()*4)+'px';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),800);
    }
    setTimeout(()=>fly.remove(),900);
  },600);

  setTimeout(async ()=>{
    tong.classList.remove('shaking');

    var resultText='';
    if(baziData){
      var baziStr=baziData.year.gan+baziData.year.zhi+' '+baziData.month.gan+baziData.month.zhi+' '+baziData.day.gan+baziData.day.zhi+' '+baziData.hour.gan+baziData.hour.zhi;
      var wx=WUXING_MAP[baziData.day.gan];
      try{
        var resp=await fetch('/api/fortune',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:'有缘人',wuxing:wx,bazi:baziStr,gender:'',mode:fortuneMode})
        });
        var j=await resp.json();
        if(j.code===200&&j.data)resultText=j.data.text;
      }catch(e){console.log('AI fail');}
    }
    if(!resultText)resultText='（天机未显，请先排八字，或稍后再试）';

    // 美化签诗显示
    var html=resultText;
    // 签文区 — 大字号、居中、金色
    html=html.replace(/【签文】([\s\S]*?)(?=【|$)/,function(_,poem){
      return '<div class="poem-display">'+poem.trim().replace(/\n/g,'<br>')+'</div>';
    });
    // 签名 — 装饰标签
    html=html.replace(/【签名】(.+)/,'<div class="sign-name-display">$1</div>');
    // 签等 — 徽章
    html=html.replace(/【签等】(.+)/,'<div class="sign-level">$1</div>');
    // 其余内容 — 正常解读
    html=html.replace(/【(解读|命局解读)】/g,'<div class="reading-label">📖 $1</div>');
    html=html.replace(/【(寄语|人生建议)】/g,'<div class="advice-label">💫 $1</div>');
    html=html.replace(/\n/g,'<br>');
    document.getElementById('fortuneText').innerHTML=html;
    document.getElementById('modeTabs').style.display='flex';

    var result=document.getElementById('result');
    result.style.display='block';
    requestAnimationFrame(function(){
      result.classList.add('show');
      result.scrollIntoView({behavior:'smooth',block:'center'});
    });
    document.getElementById('tongWrap').style.display='none';
    busy=false;
  },1000);
}

function switchMode(m){
  fortuneMode=m;
  document.querySelectorAll('.mode-tab').forEach(function(t){t.classList.toggle('on',t.dataset.mode===m)});
}

function backToTong(){
  var result=document.getElementById('result');
  result.classList.remove('show');
  setTimeout(()=>{
    result.style.display='none';
    document.getElementById('tongWrap').style.display='block';
  },400);
}

  var now=new Date();
  for(var y=1960;y<=now.getFullYear()-10;y++)ySel.add(new Option(y+'年',y));
  ySel.value=1990;
  for(var m=1;m<=12;m++)mSel.add(new Option(m+'月',m));
  function fillDays(){
    var y2=parseInt(ySel.value)||2000;var m2=parseInt(mSel.value)||1;
    var cnt=new Date(y2,m2,0).getDate();
    dSel.innerHTML='';
    for(var d=1;d<=cnt;d++)dSel.add(new Option(d+'日',d));
  }
  function tryCalc(){if(ySel.value&&mSel.value&&dSel.value)calcBazi();}
  ySel.onchange=function(){fillDays();tryCalc();};
  mSel.onchange=function(){fillDays();tryCalc();};
  dSel.onchange=tryCalc;
  document.getElementById('bhour').onchange=tryCalc;
  mSel.value=6;fillDays();dSel.value=15;
  setTimeout(tryCalc,100);
})();
</script>
</body>
