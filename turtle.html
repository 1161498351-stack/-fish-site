  <p class="count" id="count"></p>

let idx=0;

function load(i){
  idx=(i+SOUPS.length)%SOUPS.length;
  const s=SOUPS[idx];
  G('num').textContent='第 '+(idx+1)+' 碗 / 共 '+SOUPS.length+' 碗';
  G('soup').textContent=s.soup;
  G('hintBox').textContent=s.hint;
  G('hintBox').classList.remove('show');
  G('hintBtn').textContent='💡 提示';
  G('answer').textContent=s.answer;
  G('answer').classList.remove('show');
  G('count').textContent=(idx+1)+' / '+SOUPS.length;
  window.scrollTo({top:0,behavior:'smooth'});
}
function showHint(){G('hintBox').classList.toggle('show');G('hintBtn').textContent=G('hintBox').classList.contains('show')?'🫣 隐藏提示':'💡 提示';}
function reveal(){G('answer').classList.add('show');}
function prev(){load(idx-1)}
function next(){load(idx+1)}
function randomSoup(){load(Math.floor(Math.random()*SOUPS.length))}
function G(id){return document.getElementById(id)}
