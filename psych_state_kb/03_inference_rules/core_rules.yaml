# 核心推理规则 — 第一批20张推理卡
# 结构：user_signal → possible_meanings[] → should_not_conclude[] → next_questions[] → confidence

rules:

- id: work_reluctance
  signal: "不想上班/工作烦/干杂活"
  possible_meanings:
    - "工作内容与个人兴趣不匹配"
    - "缺少自主权和选择感"
    - "人际环境消耗大"
    - "付出与回报不匹配"
    - "只是短期疲惫，不代表长期倾向"
  should_not_conclude:
    - "用户懒散或缺乏责任感"
    - "用户职业失败"
    - "用户有抑郁症"
  next_questions:
    - "是工作内容本身让你烦，还是工作中的人或制度？"
    - "有没有哪类工作即使累你也愿意做？"
  confidence_rule: "单次表达为低置信度，需结合工作史、兴趣模式、行为选择综合判断"

- id: gaming_as_recovery
  signal: "打游戏放松/玩游戏恢复精力"
  possible_meanings:
    - "游戏提供可控的、有即时反馈的环境"
    - "从高压现实中暂时抽离"
    - "需要低社交消耗的独处时间"
    - "享受技能成长的成就感"
  should_not_conclude:
    - "用户沉迷游戏"
    - "用户逃避现实问题"
    - "用户社交能力差"
  next_questions:
    - "游戏里最吸引你的是什么？是赢的感觉，还是过程中的沉浸？"
    - "玩游戏之后感觉更累了，还是恢复了一些？"
  confidence_rule: "单次为低置信度；若与其他恢复方式一起指向'可控节奏'，可提到中置信度"

- id: driving_as_escape
  signal: "开车兜风/骑车/移动中感到舒服"
  possible_meanings:
    - "物理移动带来心理空间的切换"
    - "独处时间，无需回应他人"
    - "对固定环境产生疲劳"
    - "享受掌控感（方向盘在自己手里）"
  should_not_conclude:
    - "用户逃避家庭或工作责任"
    - "用户有危险驾驶倾向"
  next_questions:
    - "开车时你会想事情，还是放空？"
    - "是路上的风景让你舒服，还是一个人在车里的感觉？"
  confidence_rule: "单次低置信度；若与'可中断''可控节奏'信号同时出现，提升至中置信度"

- id: online_social_preference
  signal: "线上交流更自在/线下聚会累"
  possible_meanings:
    - "线上社交可随时中断，节奏可控"
    - "对即时社交反馈敏感"
    - "需要更长的社交预热时间"
    - "只是偏好轻量交流，不代表社交能力差"
    - "可能被线下社交中的额外信息（表情、肢体、环境噪音）消耗"
  should_not_conclude:
    - "用户有社交恐惧症"
    - "用户不会社交"
    - "用户内向=不喜欢人"
  next_questions:
    - "线上让你舒服的是能随时停，还是不用一直回应？"
    - "有没有哪种线下场合你完全不觉得累？"
  confidence_rule: "需结合线下社交历史判断；若仅线上偏好而无功能受损，为一般行为偏好"

- id: interruptible_relationships
  signal: "可以随时停下来/线上关系更轻松"
  possible_meanings:
    - "用户重视关系中可自由进退的感觉"
    - "对持续社交消耗较敏感"
    - "可能需要更清晰的个人边界"
    - "偏好低密度而非高密度的社交节奏"
  should_not_conclude:
    - "用户无法维持长期关系"
    - "用户情感冷漠"
    - "用户有依恋障碍"
  next_questions:
    - "有没有哪种关系，即使不能随时停，你也愿意一直维持？"
    - "你舒服的是自己掌控节奏，还是不用承担对方的期待？"
  confidence_rule: "低置信度；需结合长期关系史和亲密关系模式判断"

- id: novelty_enthusiasm
  signal: "刚开始很有热情/新鲜感过了就降温"
  possible_meanings:
    - "用户被新奇感和探索驱动"
    - "对重复和常规化的事情容易失去兴趣"
    - "可能是高开放性人格特征"
    - "也可能是还没找到真正持久感兴趣的方向"
  should_not_conclude:
    - "用户三分钟热度"
    - "用户缺乏毅力"
    - "用户不可靠"
  next_questions:
    - "有没有哪件事即使变得很常规了，你还在做？"
    - "降温的点通常是哪里？流程、责任、还是重复？"
  confidence_rule: "单次低置信度；若在多个领域重复出现，可提到中置信度"

- id: travel_longing
  signal: "想环游中国/想出去走走/旅行"
  possible_meanings:
    - "渴望新鲜体验和开阔视野"
    - "想要从当前生活节奏中抽离"
    - "对'在路上'的自主感有向往"
    - "可能是逃避当前压力，也可能只是纯粹的探索欲"
  should_not_conclude:
    - "用户不负责任"
    - "用户厌世"
    - "用户经济状况不理性"
  next_questions:
    - "你想要的是旅行本身，还是离开现在的节奏？"
    - "如果给你一个月自由时间，你会怎么安排？"
  confidence_rule: "需结合其他逃避或探索信号综合判断"

- id: autonomy_sensitivity
  signal: "钱多事少离家近/自由掌控/不喜欢被管"
  possible_meanings:
    - "自主权是核心需求"
    - "对强制和约束敏感"
    - "可能在过往经历中自主权受过挤压"
    - "偏好自定节奏的工作和生活方式"
  should_not_conclude:
    - "用户不合作"
    - "用户对抗权威"
    - "用户不适合团队工作"
  next_questions:
    - "是'别人安排你做'让你烦，还是'事情本身'让你烦？"
    - "如果完全由你安排，你会怎么做？"
  confidence_rule: "若在多领域（工作、社交、生活）反复出现，为中置信度"

- id: meaning_deficit
  signal: "没什么意义/无聊/没啥好的/就这样"
  possible_meanings:
    - "当前生活缺少意义感和方向感"
    - "可能有轻度快感缺失"
    - "可能只是表达当下的疲惫"
    - "可能缺少有反馈的、能看到成果的活动"
  should_not_conclude:
    - "用户抑郁"
    - "用户消极"
    - "用户没有追求"
  next_questions:
    - "最近有没有什么事让你觉得'做对了'或者'还不错'？"
    - "如果抛开现实限制，你最想做什么？"
  confidence_rule: "单次表达低置信度；若+睡眠/食欲/社交退缩则为中风险，应关注而非分析"

- id: low_energy_coping
  signal: "睡懒觉/躺着/不动/放空"
  possible_meanings:
    - "正常恢复方式（睡眠补充）"
    - "压力后的退行性恢复"
    - "可能是体力透支或睡眠不足"
    - "可能缺少能有效恢复精力的活动"
  should_not_conclude:
    - "用户懒"
    - "用户抑郁"
    - "用户没有上进心"
  next_questions:
    - "睡醒之后感觉恢复了吗，还是更累？"
    - "除了睡觉，还有什么事能让你感觉充电？"
  confidence_rule: "若仅睡眠恢复且睡眠质量好，为正常模式；若持续疲惫+社交退缩+兴趣减退，需关注"
