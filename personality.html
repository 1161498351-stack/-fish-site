<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>🧠 人格探索 · 深度对话</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1e;color:#e0e0e0;font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  display:flex;justify-content:center;align-items:center;min-height:100vh}
#app{width:500px;max-width:100%;height:100vh;display:flex;flex-direction:column;padding:16px}
h1{text-align:center;font-size:28px;letter-spacing:2px;color:#a78bfa;margin-bottom:4px}
.sub{text-align:center;font-size:11px;color:#555;margin-bottom:16px;letter-spacing:1px}
.chat-log{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:8px}
.chat-msg{max-width:88%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.8;animation:in .3s ease}
.chat-msg.ai{align-self:flex-start;background:#1e1e38;color:#c0c0d0;border-bottom-left-radius:4px}
.chat-msg.user{align-self:flex-end;background:#7c3aed;color:#fff;border-bottom-right-radius:4px}
.chat-msg .time{font-size:9px;opacity:.4;margin-top:4px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-empty{text-align:center;color:#3a3050;padding:40px 20px;line-height:2.2;font-size:13px}
.chat-empty .big{font-size:48px;display:block;margin-bottom:12px}
.input-row{display:flex;gap:8px;padding-top:8px}
.input-row textarea{flex:1;min-height:48px;resize:none;background:#1a1a30;border:1px solid #2a2a44;color:#d0c0a0;
  border-radius:12px;padding:10px 14px;font-size:13px;font-family:inherit;outline:none}
.input-row textarea:focus{border-color:#7c3aed}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn{padding:10px 20px;border-radius:10px;border:1px solid #3a3050;background:#1a1a30;color:#9080b0;
  font-family:inherit;font-size:13px;cursor:pointer;letter-spacing:1px;transition:.2s;flex:1}
.btn:hover{border-color:#7c3aed}
.btn.primary{background:#7c3aed;color:#fff;border-color:transparent;font-weight:600}
.btn.report{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-color:transparent}
.btn:disabled{opacity:.4;pointer-events:none}
.report-focus{
  padding:10px 12px;border-radius:10px;border:1px solid #3a3050;background:#1a1a30;
  color:#9080b0;font-family:inherit;font-size:12px;cursor:pointer;outline:none;
  -webkit-appearance:none;text-align:center;
}
.report-focus:focus{border-color:#7c3aed}
.foot{text-align:center;font-size:10px;color:#333;padding:8px}
.foot a{color:#555;text-decoration:none}
.round-count{text-align:center;font-size:10px;color:#444;margin-top:4px}

/* ═══════ 报告弹窗 ═══════ */
.report-overlay{
  position:fixed;inset:0;z-index:999;background:rgba(5,5,20,.88);
  display:none;justify-content:center;align-items:center;
  backdrop-filter:blur(10px);animation:fadeIn .3s ease;
}
.report-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.report-modal{
  width:620px;max-width:95vw;max-height:90vh;background:#111128;
  border:1px solid #2a2a50;border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;
  animation:slideUp .4s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px rgba(120,100,255,.1);
}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)scale(.96)}to{opacity:1;transform:translateY(0)scale(1)}}
.report-close{
  position:absolute;top:16px;right:16px;width:32px;height:32px;
  border-radius:50%;border:1px solid #3a3a50;background:#1a1a30;color:#888;
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  z-index:10;transition:.2s;
}
.report-close:hover{background:#2a2a40;color:#fff}
.report-header{
  padding:32px 32px 20px;text-align:center;
  background:linear-gradient(180deg,rgba(120,100,255,.08),transparent);
}
.report-icon{font-size:48px;margin-bottom:12px}
.report-title{font-size:24px;font-weight:700;color:#c0b0ff;letter-spacing:2px}
.report-subtitle{font-size:12px;color:#5a5a70;margin-top:6px;letter-spacing:1px}
.report-body{
  flex:1;overflow-y:auto;padding:24px 32px;
  font-size:13px;line-height:2;color:#b0b0c0;
}
.report-body strong{color:#e0d0ff}
.report-body em{color:#9a8ad0;font-style:italic}
.report-body h3{color:#c0b0ff;font-size:15px;margin:20px 0 8px;border-bottom:1px solid #1a1a30;padding-bottom:6px}
.report-footer{
  display:flex;gap:10px;padding:20px 32px;border-top:1px solid #1a1a30;
}
.rp-btn{
  flex:1;padding:12px;border-radius:10px;border:1px solid #3a3050;
  background:#1a1a30;color:#9080b0;font-family:inherit;font-size:13px;
  cursor:pointer;letter-spacing:1px;transition:.2s;
}
.rp-btn:hover{border-color:#7c3aed;color:#c0b0ff}
.rp-btn.primary{background:#7c3aed;color:#fff;border-color:transparent;font-weight:600}
.rp-btn.primary:hover{background:#6d28d9}
</style>
</head>
<body>
<div id="app">
<h1>🧠 人格探索</h1>
<p class="sub">AI深度对话 · 认识真正的自己</p>

<div class="chat-log" id="chatLog">
  <div class="chat-empty">
    <span class="big">🧠</span>
    你好！我是你的专属人格分析师。<br>
    不问卷、不测试，就随便聊聊。<br>
    聊够了点「生成报告」，<br>
    我给你一份深度分析。
  </div>
</div>

<div class="round-count" id="roundCount">开始聊天吧</div>

<div class="input-row">
  <textarea id="chatInput" name="chat" autocomplete="on" placeholder="说说你自己…比如你做什么工作？平时喜欢干嘛？" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
</div>
<div class="btn-row">
  <button class="btn primary" id="sendBtn" onclick="sendMsg()">💬 发送</button>
  <select class="report-focus" id="reportFocus">
    <option value="all">📋 全面分析</option>
    <option value="career">💼 职业与工作</option>
    <option value="love">💕 感情与人际</option>
    <option value="life">🌿 生活与价值观</option>
    <option value="stress">🫀 压力与应对</option>
  </select>
  <button class="btn report" id="reportBtn" onclick="genReport()" disabled>📊 生成报告</button>
</div>
<div class="btn-row" style="margin-top:4px">
  <button class="btn" onclick="resetChat()">🔄 重新开始</button>
</div>

<div class="foot"><a href="/">← 返回摸鱼首页</a></div>
</div>

<!-- 报告弹窗 -->
<div class="report-overlay" id="reportOverlay">
  <div class="report-modal" id="reportModal">
    <div class="report-close" onclick="closeReport()">✕</div>
    <div class="report-header">
      <div class="report-icon">📋</div>
      <div class="report-title">人格观察报告</div>
      <div class="report-subtitle">基于对话生成 · 仅供观察参考</div>
    </div>
    <div class="report-body" id="reportBody"></div>
    <div class="report-footer">
      <button class="rp-btn primary" onclick="closeReport()">返回对话</button>
      <button class="rp-btn" onclick="resetChat();closeReport()">开始新对话</button>
    </div>
  </div>
</div>

<script>
var chatHistory=[],report='';
var G=function(id){return document.getElementById(id)};

function load(){try{var d=JSON.parse(localStorage.getItem('personality_chat')||'{}');chatHistory=d.chatHistory||[];report=d.report||'';}catch(e){chatHistory=[];report='';}}
function save(){localStorage.setItem('personality_chat',JSON.stringify({chatHistory:chatHistory,report:report}));}
load();

function render(){
  var log=G('chatLog');
  if(!chatHistory.length){
    log.innerHTML='<div class="chat-empty"><span class="big">🧠</span>你好！我是你的专属人格分析师。<br>不问卷、不测试，就随便聊聊。<br>聊够了点「生成报告」，我给你一份深度分析。</div>';
  }else{
    log.innerHTML=chatHistory.map(function(m){return'<div class="chat-msg '+m.role+'">'+m.content+'<div class="time">'+(m.role==='ai'?'分析师':'你')+'</div></div>';}).join('');
  }
  G('roundCount').textContent=chatHistory.length?'已聊 '+Math.floor(chatHistory.length/2)+' 轮':'开始聊天吧';
  G('reportBtn').disabled=chatHistory.length<4; // 至少聊过两句
  scrollBottom();
}

function scrollBottom(){var log=G('chatLog');setTimeout(function(){log.scrollTop=log.scrollHeight},50);}

function sendMsg(){
  var input=G('chatInput'),btn=G('sendBtn');
  var text=input.value.trim();
  if(!text)return;
  input.value='';input.disabled=true;btn.disabled=true;
  chatHistory.push({role:'user',content:text});save();render();

  fetch('/api/personality',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chatHistory:chatHistory,name:'朋友',mode:chatHistory.length<=2?'start':'chat'})
  }).then(function(r){return r.json()}).then(function(j){
    if(j.code===200&&j.data){
      chatHistory.push({role:'ai',content:j.data.text});save();render();
    }
  }).finally(function(){input.disabled=false;btn.disabled=false;input.focus();});
}

// ═══════ 知识库匹配引擎 ═══════
var kbRules=[],kbLoaded=false;
fetch('/kb_rules.json').then(function(r){return r.json()}).then(function(d){kbRules=d;kbLoaded=true;}).catch(function(){});

function matchKB(chatHistory){
  if(!kbRules.length)return[];
  // 提取用户所有发言
  var userText=chatHistory.filter(function(m){return m.role==='user'}).map(function(m){return m.content}).join(' ');
  var matched=[];
  for(var i=0;i<kbRules.length;i++){
    var rule=kbRules[i];
    for(var j=0;j<rule.signal.length;j++){
      if(userText.indexOf(rule.signal[j])>=0){
        matched.push(rule);
        break; // 匹配一次就够了
      }
    }
  }
  return matched;
}

function genReport(){
  if(!confirm('基于当前'+Math.floor(chatHistory.length/2)+'轮对话生成深度分析报告？'))return;
  var btn=G('reportBtn'),matched=matchKB(chatHistory);
  btn.disabled=true;btn.textContent='⏳ 分析中…';
  fetch('/api/personality',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({chatHistory:chatHistory,name:'朋友',mode:'report',kbHints:matched,focus:G('reportFocus').value})
  }).then(function(r){return r.json()}).then(function(j){
    if(j.code===200&&j.data){
      report=j.data.text;
      save();
      // 弹窗展示报告
      G('reportBody').innerHTML=report.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
      G('reportOverlay').classList.add('show');
      document.body.style.overflow='hidden';
    }
  }).finally(function(){btn.disabled=false;btn.textContent='📊 生成报告';});
}

function closeReport(){
  G('reportOverlay').classList.remove('show');
  document.body.style.overflow='';
}

function resetChat(){
  if(chatHistory.length&&!confirm('确定清除所有对话记录？'))return;
  chatHistory=[];report='';save();render();
}

render();
// 如果聊天为空，AI 先说第一句话
if(!chatHistory.length){
  setTimeout(function(){
    G('sendBtn').disabled=true;
    fetch('/api/personality',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:[],name:'朋友',mode:'start'})})
    .then(function(r){return r.json()}).then(function(j){
      if(j.code===200&&j.data){chatHistory.push({role:'ai',content:j.data.text});save();render();}
    }).finally(function(){G('sendBtn').disabled=false;G('chatInput').focus();});
  },400);
} else {
  setTimeout(function(){G('chatInput').focus();},300);
}
</script>
</body>
</html>
